[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residualquant"
version = "0.1.0"
description = "ResidualQuant: KV cache quantization for looped Transformers"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "vllm==0.10.2",
  "transformers==4.56.2",
  "uvloop==0.22.1",
  "datasets==5.0.1",
  "huggingface-hub==0.36.2",
  "lm-eval[api,math]==0.4.13",
  "evalplus==0.3.1",
]

[dependency-groups]
build = ["setuptools==84.0.0", "wheel==0.48.0", "ninja==1.13.2"]
plugins = ["looped_transformers==0.1.0", "residual_quantization==0.1.0"]

[tool.uv]
default-groups = ["build", "plugins"]
no-build-isolation-package = ["residual_quantization"]

[tool.uv.sources]
looped_transformers = { workspace = true }
residual_quantization = { workspace = true, editable = false }

[tool.uv.workspace]
members = ["plugins/looped_transformers", "plugins/residual_quantization"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["looped_transformers", "residual_quantization"]
